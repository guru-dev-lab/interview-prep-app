<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Xhire</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:transparent;color:#e2e8f0;font-family:Inter,sans-serif;border-radius:12px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

.container{height:100%;background:rgba(6,8,15,.95);border-radius:12px;border:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;overflow:hidden}

/* Titlebar */
.titlebar{height:36px;background:#0c1019;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between;padding:0 14px;-webkit-app-region:drag;flex-shrink:0;border-radius:12px 12px 0 0}
.titlebar h1{font:700 11px Inter,sans-serif;color:#94a3b8;display:flex;align-items:center;gap:6px}
.titlebar .dot{width:7px;height:7px;border-radius:50%;background:#FBBF24}

/* Body */
.body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;gap:16px;-webkit-app-region:no-drag}

.logo{font:800 28px Inter,sans-serif;background:linear-gradient(135deg,#7c3aed,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2px}
.sub{font:400 13px Inter,sans-serif;color:#64748b;max-width:280px;line-height:1.6}

.form{width:100%;max-width:300px;display:flex;flex-direction:column;gap:10px}
.form input{width:100%;padding:10px 14px;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:rgba(255,255,255,.05);color:#e2e8f0;font:400 13px Inter,sans-serif;outline:none;transition:.15s;cursor:text;-webkit-user-select:text;user-select:text}
.form input:focus{border-color:#7c3aed;background:rgba(255,255,255,.08)}
.form input::placeholder{color:#4b5563}

.connect-btn{width:100%;padding:12px;border:none;border-radius:8px;background:linear-gradient(135deg,#7c3aed,#6d28d9);font:700 13px Inter,sans-serif;color:#fff;cursor:pointer;transition:.15s}
.connect-btn:hover{transform:translateY(-1px);box-shadow:0 4px 15px rgba(124,58,237,.3)}
.connect-btn:active{transform:translateY(0)}
.connect-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

.divider{display:flex;align-items:center;gap:12px;width:100%;max-width:300px;margin:2px 0}
.divider-line{flex:1;height:1px;background:rgba(255,255,255,.08)}
.divider-text{font:500 10px Inter,sans-serif;color:#475569;text-transform:uppercase;letter-spacing:.5px}

#google-btn-wrap{width:100%;max-width:300px;display:flex;justify-content:center;min-height:44px}

.error{font:500 11px Inter,sans-serif;color:#F87171;padding:6px 10px;background:rgba(248,113,113,.08);border-radius:6px;display:none;width:100%;max-width:300px;text-align:center}

.sessions{width:100%;max-width:340px;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto;padding:2px}
.sessions::-webkit-scrollbar{width:3px}
.sessions::-webkit-scrollbar-thumb{background:rgba(124,58,237,.3);border-radius:2px}
.session-item{padding:12px 14px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(255,255,255,.03);cursor:pointer;text-align:left;transition:all .2s ease;display:flex;align-items:center;gap:12px}
.session-item:hover{border-color:rgba(124,58,237,.4);background:rgba(124,58,237,.08);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.session-item:active{transform:translateY(0)}
.s-avatar{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:800 16px Inter,sans-serif;color:#fff;flex-shrink:0;letter-spacing:-.5px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.s-info{flex:1;min-width:0}
.session-item .s-company{font:600 13px Inter,sans-serif;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.session-item .s-role{font:400 11px Inter,sans-serif;color:#64748b;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.jobscout-card{padding:12px 14px;border:1px solid rgba(16,185,129,.35);border-radius:12px;background:linear-gradient(135deg,rgba(16,185,129,.10),rgba(6,182,212,.08));cursor:pointer;text-align:left;transition:all .2s ease;display:flex;align-items:center;gap:12px;margin-bottom:10px}
.jobscout-card:hover{border-color:rgba(16,185,129,.6);background:linear-gradient(135deg,rgba(16,185,129,.16),rgba(6,182,212,.14));transform:translateY(-1px);box-shadow:0 4px 14px rgba(6,182,212,.18)}
.jobscout-card:active{transform:translateY(0)}
.jobscout-card .js-avatar{width:40px;height:40px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#10B981,#06B6D4);color:#fff}
.jobscout-card .s-company{font:600 13px Inter,sans-serif;color:#e2e8f0}
.jobscout-card .s-role{font:400 11px Inter,sans-serif;color:#7dd3c0;margin-top:3px}
.jobscout-card .js-arrow{color:#10B981;flex-shrink:0;margin-left:auto}
.s-role-icon{opacity:.5;flex-shrink:0}
.note-card{padding:12px 14px;border:1px solid rgba(124,58,237,.4);border-radius:12px;background:linear-gradient(135deg,rgba(124,58,237,.12),rgba(99,102,241,.08));cursor:pointer;text-align:left;transition:all .2s ease;display:flex;align-items:center;gap:12px;margin-bottom:10px}
.note-card:hover{border-color:rgba(124,58,237,.7);background:linear-gradient(135deg,rgba(124,58,237,.2),rgba(99,102,241,.14));transform:translateY(-1px);box-shadow:0 4px 14px rgba(124,58,237,.18)}
.note-card:active{transform:translateY(0)}
.note-card .note-icon{width:40px;height:40px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#7c3aed,#6366f1);color:#fff}
.note-card .s-company{font:600 13px Inter,sans-serif;color:#e2e8f0}
.note-card .s-role{font:400 11px Inter,sans-serif;color:#c4b5fd;margin-top:3px}
.note-card .note-arrow{color:#a78bfa;flex-shrink:0;margin-left:auto}
/* Assessment (desktop only) — amber so it never reads as a company session */
.as-card{width:100%;max-width:340px;padding:12px 14px;border:1px solid rgba(251,191,36,.35);border-radius:12px;background:linear-gradient(135deg,rgba(251,191,36,.10),rgba(249,115,22,.07));cursor:pointer;text-align:left;transition:all .2s ease;display:flex;align-items:center;gap:12px}
.as-card:hover{border-color:rgba(251,191,36,.6);background:linear-gradient(135deg,rgba(251,191,36,.16),rgba(249,115,22,.12));transform:translateY(-1px);box-shadow:0 4px 14px rgba(251,191,36,.14)}
.as-card:active{transform:translateY(0)}
.as-icon{width:40px;height:40px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#F59E0B,#F97316);color:#fff}
.as-card .s-company{font:600 13px Inter,sans-serif;color:#e2e8f0}
.as-card .s-role{font:400 11px Inter,sans-serif;color:#fcd34d;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.as-arrow{color:#F59E0B;flex-shrink:0;margin-left:auto}
.as-head{font:700 13px Inter,sans-serif;color:#fcd34d;display:flex;align-items:center;gap:8px}
.as-q{font:400 11px Inter,sans-serif;color:#94a3b8}
.as-last{width:100%;max-width:340px;padding:10px 12px;border:1px solid rgba(251,191,36,.45);border-radius:12px;background:rgba(251,191,36,.08);text-align:left;cursor:pointer;transition:all .2s ease}
.as-last:hover{background:rgba(251,191,36,.14);transform:translateY(-1px)}
.as-last .as-k{font:700 8.5px Inter,sans-serif;letter-spacing:.8px;text-transform:uppercase;color:#F59E0B}
.as-last .as-t{font:600 12px Inter,sans-serif;color:#f1f5f9;margin-top:3px;line-height:1.35;padding-right:22px}
.as-last .as-d{font:400 10px Inter,sans-serif;color:#94a3b8;margin-top:3px}
.as-new{width:100%;max-width:340px;padding:8px;border:1px dashed rgba(255,255,255,.18);border-radius:10px;background:transparent;font:600 11px Inter,sans-serif;color:#cbd5e1;cursor:pointer;transition:.15s}
.as-new:hover{border-color:rgba(251,191,36,.5);color:#fcd34d}
.as-hist-h{width:100%;max-width:340px;font:700 8.5px Inter,sans-serif;letter-spacing:.8px;text-transform:uppercase;color:#475569;text-align:left;margin-top:2px}
.as-hist{width:100%;max-width:340px;display:flex;flex-direction:column;gap:5px;max-height:190px;overflow-y:auto}
.as-row{padding:6px 10px 6px 7px;border:1px solid rgba(255,255,255,.07);border-radius:9px;background:rgba(255,255,255,.025);text-align:left;cursor:pointer;display:flex;align-items:center;gap:10px;transition:.15s}
.as-row:hover{border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.06)}
/* history rows use the Continue-last card's fonts (owner, 13 Oct: "they need to be same font") */
.as-row .as-t{flex:1;min-width:0;font:600 12px Inter,sans-serif;color:#f1f5f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.as-row .as-d{font:400 10px Inter,sans-serif;color:#94a3b8;flex-shrink:0}
.as-pending{color:#94a3b8;font-style:italic}
#step-assessment.active{gap:10px}
.as-last{position:relative}
.as-x{flex-shrink:0;width:18px;height:18px;border:none;border-radius:6px;background:rgba(255,255,255,.05);color:#64748b;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;align-self:center}
.as-x:hover{background:rgba(248,113,113,.15);color:#F87171}
.as-x-corner{position:absolute;top:8px;right:8px}
.as-confirm{border-color:rgba(248,113,113,.45)!important;background:rgba(248,113,113,.07)!important;cursor:default;flex-direction:column;align-items:stretch;gap:8px}
.as-confirm .as-t{white-space:normal;font:500 11px Inter,sans-serif;color:#fecaca;line-height:1.4}
.as-confirm .as-t b{color:#fff;font-weight:600}
.as-btns{display:flex;gap:8px}
.as-btns button{flex:1;padding:5px;border-radius:7px;border:1px solid rgba(255,255,255,.12);background:transparent;color:#cbd5e1;font:600 10.5px Inter,sans-serif;cursor:pointer}
.as-btns .as-yes{background:#DC2626;border-color:#DC2626;color:#fff}
.as-btns .as-yes:disabled{opacity:.6}
.as-row .as-x{align-self:center}
.s-avatar-img{width:100%;height:100%;object-fit:contain;border-radius:8px;padding:4px}
.s-avatar-letter{width:100%;height:100%;display:flex;align-items:center;justify-content:center}

.step{display:none}
.step.active{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.back-btn{font:500 11px Inter,sans-serif;color:#64748b;background:none;border:none;cursor:pointer}
.back-btn:hover{color:#a78bfa}

@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:16px;height:16px;border:2px solid rgba(167,139,250,.3);border-top-color:#a78bfa;border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
</style>
</head>
<body>
<div class="container">
  <div class="titlebar">
    <h1><span class="dot"></span> Xhire Overlay</h1>
  </div>
  <div class="body">
    <!-- Step 1: Login -->
    <div id="step-login" class="step active">
      <div class="logo">Xhire</div>
      <div class="sub">Sign in to start your interview overlay.</div>
      <div class="form">
        <input id="email" type="email" placeholder="Email" autocomplete="email" spellcheck="false">
        <input id="password" type="password" placeholder="Password" autocomplete="current-password">
        <button id="login-btn" class="connect-btn" onclick="doLogin()">Sign In</button>
      </div>
      <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-text">or</div>
        <div class="divider-line"></div>
      </div>
      <div id="google-btn-wrap"></div>
      <button id="google-fallback" class="connect-btn" style="display:none;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)" onclick="googleFallback()">
        <span style="display:flex;align-items:center;justify-content:center;gap:8px">
          <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#4285F4" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#34A853" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59a14.5 14.5 0 010-9.18l-7.98-6.19a24.01 24.01 0 000 21.56l7.98-6.19z"/><path fill="#EA4335" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Continue with Google
        </span>
      </button>
      <div id="login-error" class="error"></div>
    </div>

    <!-- Step 2: Pick Session -->
    <div id="step-sessions" class="step">
      <div class="sub">Select a session:</div>
      <div id="session-list" class="sessions"></div>
      <button class="back-btn" onclick="showStep('step-login')">&larr; Back</button>
    </div>

    <!-- Step 2b: Assessment (desktop only) — continue the last one or start new; history locked by title + start time -->
    <div id="step-assessment" class="step">
      <div class="as-head"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Assessment</div>
      <div class="as-q">Continue where you left off?</div>
      <div id="as-last" class="as-last"></div>
      <button class="as-new" onclick="startNewAssessment()">+ Start a new assessment</button>
      <div id="as-hist-h" class="as-hist-h">History</div>
      <div id="as-hist" class="as-hist"></div>
      <div id="as-error" class="error"></div>
      <button class="back-btn" onclick="showStep('step-sessions')">&larr; Back</button>
    </div>
    <!-- Step 3: Connecting -->
    <div id="step-connecting" class="step">
      <span class="spinner"></span>
      <div class="sub">Loading session...</div>
    </div>

  </div>
</div>

<script>
var SERVER = '';
var authToken = '';
var userId = '';
var GOOGLE_CLIENT_ID = '';

// Persist token so Electron doesn't lose session on hide/show or restart
function saveToken(token, uid) {
  authToken = token;
  userId = uid || '';
  try { localStorage.setItem('xhire_token', token); localStorage.setItem('xhire_uid', uid || ''); } catch(e) {}
}
function clearSavedToken() {
  authToken = '';
  userId = '';
  try { localStorage.removeItem('xhire_token'); localStorage.removeItem('xhire_uid'); } catch(e) {}
}

// Get server URL and config
(async function() {
  if (window.electronAPI) {
    SERVER = await window.electronAPI.getServerUrl();
  } else {
    SERVER = location.origin || 'https://xhire.app';
  }
  // Fetch Google Client ID from server config
  try {
    var cfgRes = await fetch(SERVER + '/api/config');
    var cfg = await cfgRes.json();
    if (cfg.googleClientId) {
      GOOGLE_CLIENT_ID = cfg.googleClientId;
      initGoogleAuth();
    }
  } catch(e) { console.log('Config fetch failed:', e); }

  // Try to restore saved session (Electron or returning web user)
  try {
    var saved = localStorage.getItem('xhire_token');
    if (saved) {
      authToken = saved;
      userId = localStorage.getItem('xhire_uid') || '';
      var res = await fetch(SERVER + '/api/auth/me', { headers: { 'Authorization': 'Bearer ' + saved } });
      if (res.ok) {
        var data = await res.json();
        if (data.token) saveToken(data.token, data.user ? data.user.id : userId);
        loadSessions();
        return;
      } else {
        clearSavedToken();
      }
    }
  } catch(e) { clearSavedToken(); }
})();

var gsiRetries = 0;
function initGoogleAuth() {
  if (!window.google || !GOOGLE_CLIENT_ID) {
    gsiRetries++;
    if (gsiRetries > 10) {
      // GSI library failed to load — show fallback button
      console.log('GSI library not available, showing fallback');
      document.getElementById('google-fallback').style.display = 'block';
      return;
    }
    setTimeout(initGoogleAuth, 300);
    return;
  }
  try {
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: handleGoogleResponse
    });
    google.accounts.id.renderButton(
      document.getElementById('google-btn-wrap'),
      { theme: 'filled_black', size: 'large', width: 300, text: 'continue_with', shape: 'pill' }
    );
    // If button didn't render after a moment, show fallback
    setTimeout(function() {
      var wrap = document.getElementById('google-btn-wrap');
      if (wrap && wrap.children.length === 0) {
        document.getElementById('google-fallback').style.display = 'block';
      }
    }, 1500);
  } catch(e) {
    console.log('GSI init failed:', e);
    document.getElementById('google-fallback').style.display = 'block';
  }
}

function googleFallback() {
  // Open Google OAuth in a popup/redirect flow
  if (!GOOGLE_CLIENT_ID) { showError('Google sign-in not configured'); return; }
  var redirectUri = SERVER + '/api/auth/google/callback';
  var url = 'https://accounts.google.com/o/oauth2/v2/auth?client_id=' + encodeURIComponent(GOOGLE_CLIENT_ID)
    + '&redirect_uri=' + encodeURIComponent(redirectUri)
    + '&response_type=code&scope=openid%20email%20profile&prompt=select_account';
  window.location.href = url;
}

async function handleGoogleResponse(response) {
  try {
    var res = await fetch(SERVER + '/api/auth/google', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ credential: response.credential })
    });
    var data = await res.json();
    if (!res.ok || !data.token) { showError(data.error || 'Google sign-in failed'); return; }
    saveToken(data.token, data.user ? data.user.id : '');
    loadSessions();
  } catch(e) {
    showError('Google sign-in failed');
  }
}

function showStep(id) {
  document.querySelectorAll('.step').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  if (id === 'step-sessions') { renderJobScout(); renderAssessmentCard(); renderNoteCard(); }
}

// Answer Note (owner, 23 Oct) — desktop AND browser. Its own window: the server page /note (no app build needed).
// Desktop: window.open from the overlay makes a normal always-on-top window; browser: a new tab.
function renderNoteCard() {
  if (!window.electronAPI) return;                 // owner 24 Oct: the Answer Note lives in the desktop app only
  if (document.getElementById('note-card')) return;
  var list = document.getElementById('session-list'); if (!list) return;
  var card = document.createElement('div');
  card.id = 'note-card'; card.className = 'note-card'; card.setAttribute('title', 'Your answers, one click away during a call');
  card.onclick = openNote;
  card.innerHTML = '<div class="note-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg></div>'
    + '<div class="s-info"><div class="s-company">Answer Note</div><div class="s-role">Your answers, ready to read on a call</div></div>'
    + '<svg class="note-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  list.parentNode.insertBefore(card, list);
}
function openNote() {
  var url = SERVER + '/note?token=' + encodeURIComponent(authToken);
  if (window.electronAPI) window.open(url, 'xhire-note', 'width=1040,height=720,alwaysOnTop=yes,title=Answer Note');
  else window.open(url, 'xhire-note');
}

// Job Scout entry — WEB ONLY. Never rendered inside the Electron desktop app
// (Electron exposes window.electronAPI; the browser does not). The element is
// only ever created when running in a plain browser, so the desktop launcher
// DOM is identical to the original.
var JOBS_URL = 'https://web-production-e1ffee.up.railway.app';
function renderJobScout() {
  if (window.electronAPI) return;                 // desktop app -> do nothing
  if (document.getElementById('jobscout-card')) return;  // already added
  var host = document.getElementById('step-sessions');
  var list = document.getElementById('session-list');
  if (!host || !list) return;
  var card = document.createElement('div');
  card.id = 'jobscout-card';
  card.className = 'jobscout-card';
  card.setAttribute('title', 'Find your next role with Job Scout');
  card.onclick = openJobScout;
  card.innerHTML =
    '<div class="js-avatar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></div>'
    + '<div class="s-info"><div class="s-company">Job Scout</div><div class="s-role">Find &amp; track your next role</div></div>'
    + '<svg class="js-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  list.parentNode.insertBefore(card, list);       // above the session list
}
function openJobScout() {
  var sep = JOBS_URL.indexOf('?') > -1 ? '&' : '?';
  var url = JOBS_URL + (authToken ? sep + 'xhire_token=' + encodeURIComponent(authToken) : '');
  window.open(url, '_blank');                      // web: open in a new tab
}

// ===== ASSESSMENT — DESKTOP ONLY (owner, 13 Oct). Never rendered in a browser (no window.electronAPI there). =====
// Not tied to a company. Opening it: no history → a new one starts at once; history → "continue the last one?" first.
// Each assessment is listed by the title locked from its content + the date/time it started.
var assessments = null; // last list from the server
function fmtWhen(iso) {
  try { var d = new Date(iso); return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: d.getFullYear() === new Date().getFullYear() ? undefined : 'numeric' }) + ', ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }); } catch (e) { return ''; }
}
function asError(msg) { // the login error box is hidden on these steps — show it where he is
  var host = document.querySelector('.step.active'), el = document.getElementById('as-error');
  if (host && host.id === 'step-sessions') { var c = document.querySelector('#as-card .s-role'); if (c) { c.textContent = msg; return; } }
  if (el) { el.textContent = msg; el.style.display = 'block'; setTimeout(function () { el.style.display = 'none'; }, 4000); }
}
function asTitle(a) { return a.title ? esc(a.title) : '<span class="as-pending">Untitled — named after its next save</span>'; }
async function fetchAssessments() {
  var res = await fetch(SERVER + '/api/assessments', { headers: { 'Authorization': 'Bearer ' + authToken } });
  if (!res.ok) throw new Error('assessments ' + res.status);
  return res.json();
}
async function renderAssessmentCard() {
  if (!window.electronAPI) return;                          // desktop app only
  var host = document.getElementById('step-sessions'), list = document.getElementById('session-list');
  if (!host || !list || !authToken) return;
  var data;
  try { data = await fetchAssessments(); } catch (e) { console.warn('[Assessment] list failed:', e); return; }
  var old = document.getElementById('as-card'); if (old) old.remove();
  if (!data.allowed) return;                                // not on this profile type
  assessments = data.items || [];
  var last = assessments[0];
  var card = document.createElement('div');
  card.id = 'as-card'; card.className = 'as-card'; card.onclick = openAssessment;
  card.innerHTML = '<div class="as-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div>'
    + '<div class="s-info"><div class="s-company">Assessment</div><div class="s-role">Help with any online test</div></div>'
    + '<svg class="as-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  list.parentNode.insertBefore(card, list);
}
async function openAssessment() {
  try { var data = await fetchAssessments(); assessments = data.items || []; } catch (e) { asError('Could not load assessments'); return; }
  if (!assessments.length) return startNewAssessment();    // first time: straight in
  renderAssessmentStep();
  showStep('step-assessment');
}
var AS_X = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
function renderAssessmentStep() {
  var last = assessments[0];
  var el = document.getElementById('as-last');
  el.innerHTML = '<button class="as-x as-x-corner" title="Remove this assessment">' + AS_X + '</button>'
    + '<div class="as-k">Continue last</div><div class="as-t">' + asTitle(last) + '</div>'
    + '<div class="as-d">Started ' + esc(fmtWhen(last.started)) + (last.sittings > 1 ? ' · ' + last.sittings + ' sittings' : '') + (last.carried ? ' · progress saved' : '') + '</div>';
  el.onclick = function () { connectToAssessment(last.id, false); };
  el.querySelector('.as-x').onclick = function (e) { e.stopPropagation(); askRemove(el, last); };
  var rest = assessments.slice(1), hist = document.getElementById('as-hist');
  hist.innerHTML = '';
  rest.forEach(function (a) {
    var row = document.createElement('div'); row.className = 'as-row';
    row.innerHTML = '<button class="as-x" title="Remove this assessment">' + AS_X + '</button><div class="as-t">' + asTitle(a) + '</div><div class="as-d">' + esc(fmtWhen(a.started)) + '</div>';
    row.onclick = function () { connectToAssessment(a.id, false); };
    row.querySelector('.as-x').onclick = function (e) { e.stopPropagation(); askRemove(row, a); };
    hist.appendChild(row);
  });
  document.getElementById('as-hist-h').style.display = rest.length ? '' : 'none';
  hist.style.display = rest.length ? '' : 'none';
}
// × → the row itself asks (no browser dialog — it would freeze the overlay); Remove deletes it completely, Keep puts it back
function askRemove(el, a) {
  var open = el.onclick; el.onclick = null; el.classList.add('as-confirm');
  el.innerHTML = '<div class="as-t">Remove <b>' + (a.title ? esc(a.title) : 'this untitled assessment') + '</b> and everything in it?</div>'
    + '<div class="as-btns"><button class="as-yes">Remove</button><button class="as-no">Keep</button></div>';
  el.querySelector('.as-no').onclick = function (e) { e.stopPropagation(); el.classList.remove('as-confirm'); el.onclick = open; renderAssessmentStep(); };
  el.querySelector('.as-yes').onclick = async function (e) {
    e.stopPropagation();
    this.disabled = true; this.textContent = 'Removing…';
    try {
      var res = await fetch(SERVER + '/api/assessments/' + encodeURIComponent(a.id), { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + authToken } });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok || !data.removed) { asError(data.error || 'Could not remove it'); renderAssessmentStep(); return; }
      assessments = assessments.filter(function (x) { return x.id !== a.id; }); // removed only after the server confirmed it
      renderAssessmentCard();                                                   // the card's "Last:" line follows
      if (!assessments.length) { showStep('step-sessions'); return; }
      renderAssessmentStep();
    } catch (err) { asError('Could not remove it'); renderAssessmentStep(); }
  };
}
async function startNewAssessment() {
  try {
    var res = await fetch(SERVER + '/api/assessments', { method: 'POST', headers: { 'Authorization': 'Bearer ' + authToken } });
    var data = await res.json();
    if (!res.ok || !data.id) { asError(data.error || 'Could not start an assessment'); return; }
    connectToAssessment(data.id, true);
  } catch (e) { asError('Could not start an assessment'); }
}
function connectToAssessment(id, isNew) {
  showStep('step-connecting');
  var url = SERVER + '/canvas?token=' + encodeURIComponent(authToken) + '&session=' + encodeURIComponent(id) + '&electron=1&assessment=' + (isNew ? 'new' : 'continue');
  window.electronAPI.loadCanvas(url);
}

function showError(msg) {
  var el = document.getElementById('login-error');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(function() { el.style.display = 'none'; }, 4000);
}

async function doLogin() {
  var email = document.getElementById('email').value.trim();
  var pass = document.getElementById('password').value;
  if (!email || !pass) { showError('Enter email and password'); return; }

  var btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.textContent = 'Signing in...';

  try {
    var res = await fetch(SERVER + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: pass })
    });
    var data = await res.json();
    if (!res.ok || !data.token) { showError(data.error || 'Login failed'); btn.disabled = false; btn.textContent = 'Sign In'; return; }

    saveToken(data.token, data.user ? data.user.id : (data.userId || data.user_id || ''));
    loadSessions();
  } catch (e) {
    showError('Cannot reach server');
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
}

async function loadSessions() {
  try {
    var res = await fetch(SERVER + '/api/sessions', {
      headers: { 'Authorization': 'Bearer ' + authToken }
    });
    var sessions = await res.json();
    var list = document.getElementById('session-list');
    list.innerHTML = '';

    if (!sessions.length) {
      list.innerHTML = '<div class="sub">No sessions yet. Create one on xhire.app first.</div>';
      showStep('step-sessions');
      return;
    }

    var gradients = [
      ['#7C3AED','#6366F1'],['#EC4899','#F43F5E'],['#F59E0B','#EF4444'],
      ['#10B981','#06B6D4'],['#3B82F6','#8B5CF6'],['#F97316','#FBBF24'],
      ['#14B8A6','#22D3EE'],['#E11D48','#BE185D'],['#8B5CF6','#EC4899'],
      ['#059669','#10B981']
    ];
    sessions.forEach(function(s, i) {
      var company = s.company || 'Untitled';
      var initial = company.charAt(0).toUpperCase();
      var g = gradients[i % gradients.length];
      var logo = getLogo(company);
      var div = document.createElement('div');
      div.className = 'session-item';
      var avatarHTML;
      if (logo) {
        avatarHTML = '<div class="s-avatar" style="background:linear-gradient(135deg,' + g[0] + ',' + g[1] + ')"><img class="s-avatar-img" src="' + logo + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><span class="s-avatar-letter" style="display:none">' + esc(initial) + '</span></div>';
      } else {
        avatarHTML = '<div class="s-avatar" style="background:linear-gradient(135deg,' + g[0] + ',' + g[1] + ')">' + esc(initial) + '</div>';
      }
      div.innerHTML = avatarHTML
        + '<div class="s-info"><div class="s-company">' + esc(company) + '</div>'
        + '<div class="s-role"><svg class="s-role-icon" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a4 4 0 00-8 0v2"/></svg>' + esc(s.role || 'No role') + '</div></div>';
      div.onclick = function() { connectToSession(s.id); };
      list.appendChild(div);
    });

    showStep('step-sessions');
  } catch (e) {
    showError('Failed to load sessions');
  }
}

function connectToSession(sessionId) {
  showStep('step-connecting');
  var canvasUrl = SERVER + '/canvas?token=' + encodeURIComponent(authToken) + '&session=' + encodeURIComponent(sessionId) + '&electron=1';
  if (window.electronAPI) {
    window.electronAPI.loadCanvas(canvasUrl);
  } else {
    window.location.href = canvasUrl;
  }
}

function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// Logo helpers (same as web app)
var DOMAINS={'microsoft':'microsoft.com','google':'google.com','amazon':'amazon.com','meta':'meta.com','apple':'apple.com','salesforce':'salesforce.com','wells fargo':'wellsfargo.com','bbva':'bbva.com','lexia':'lexialearning.com','cambium':'cambiumlearning.com','r&l':'rlcarriers.com','deloitte':'deloitte.com','accenture':'accenture.com','snowflake':'snowflake.com','databricks':'databricks.com','netflix':'netflix.com','ibm':'ibm.com','oracle':'oracle.com','stripe':'stripe.com','airbnb':'airbnb.com','uber':'uber.com','spotify':'spotify.com','slack':'slack.com','shopify':'shopify.com','twitter':'x.com','tesla':'tesla.com','nvidia':'nvidia.com','adobe':'adobe.com','linkedin':'linkedin.com','github':'github.com','zoom':'zoom.us','coinbase':'coinbase.com','dropbox':'dropbox.com','lyft':'lyft.com','twilio':'twilio.com','square':'squareup.com','robinhood':'robinhood.com','palantir':'palantir.com','datadog':'datadoghq.com'};
function getDomain(co){if(!co)return'';var l=co.toLowerCase();for(var k in DOMAINS){if(l.indexOf(k)>=0)return DOMAINS[k]}return l.replace(/[^a-z0-9]/g,'')+'.com'}
function getLogo(co){var d=getDomain(co);if(!d)return'';return'https://www.google.com/s2/favicons?domain='+d+'&sz=128'}

// Enter key to login
document.getElementById('password').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('email').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('password').focus();
});
// Auto-focus email on load
setTimeout(function() { document.getElementById('email').focus(); }, 200);

// Handle Google OAuth redirect callback
(function() {
  var p = new URLSearchParams(location.search);
  if (p.get('authed') === '1' && p.get('token')) {
    authToken = p.get('token');
    // Clean URL
    history.replaceState(null, '', location.pathname);
    loadSessions();
  }
})();
</script>
